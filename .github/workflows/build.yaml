name: fluid-k8s-apps

# `master` is deliberately absent. Note that dropping it here does not stop a push to
# master from building: Actions runs the workflow file belonging to the pushed ref, and
# master carries its own copy publishing to s3://fluid-artifacts/, which genesis does
# not read. Retiring that branch is the actual fix.
on:
  push:
    branches: [production, dev]
  pull_request:
    branches: [production, dev]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'

    steps:
      - uses: actions/checkout@v3

      - uses: azure/setup-kubectl@v3
      - uses: azure/setup-helm@v3

      - name: Install yq
        run: |
          command -v yq && exit 0
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check the render check itself
        run: bash ci/tests/run.sh

      - name: Application policy and versioned-directory render
        run: bash ci/check.sh

  publish:
    name: build
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v3

      - uses: azure/setup-kubectl@v3
      - uses: azure/setup-helm@v3

      - name: 'authenticate GCP'
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: ${{secrets.GCP_PROJECT_NAME}}
          workload_identity_provider: ${{secrets.GCP_WORKLOAD_PROVIDER}}

      - name: 'Set Up gcloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Build Kube Manifest
        run: |
          HOME=`pwd`
          mkdir -p $HOME/artifacts/
          kubectl version --client=true

          kubectl kustomize $HOME/.argo-apps > $HOME/artifacts/argo-apps.yaml
          kubectl kustomize $HOME/argocd > $HOME/artifacts/argocd.yaml
          kubectl kustomize $HOME/longhorn > $HOME/artifacts/longhorn.yaml

          mkdir -p $HOME/artifacts/apps
          cp $HOME/.argo-apps/*.yaml $HOME/artifacts/apps/

          cd "$HOME/cni/cilium/"
          helm dependency build
          helm template . -f values.yaml -n kube-system > "$HOME/artifacts/cilium.yaml"

          find $HOME/artifacts -type f -exec sed -i 's/BRANCHREPLACEMENT/${{ github.ref_name }}/g' {} +
          find $HOME/artifacts/apps -type f -exec sed -i 's/BRANCHREPLACEMENT/${{ github.ref_name }}/g' {} +

      - name: Sync to GCS
        run: |
          gcloud storage rsync ${{ env.SOURCE_DIR }} gs://${{ env.GCS_BUCKET }}/${{ env.DEST_DIR }}/${{ github.ref_name }} --recursive --no-ignore-symlinks
        env:
          GCS_BUCKET: artifacts.fluidhq.io
          SOURCE_DIR: artifacts
          DEST_DIR: fluid-kube
