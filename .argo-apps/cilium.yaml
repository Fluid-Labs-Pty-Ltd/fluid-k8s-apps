apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fluid: "true"
    category: system
  annotations:
    fluidhq.io/display: "Cilium CNI"
  name: cilium
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cni/cilium
    repoURL: https://github.com/Fluid-Labs-Pty-Ltd/fluid-k8s-apps.git
    targetRevision: BRANCHREPLACEMENT
  # prune is off because losing the primary CNI is a total cluster outage, and an
  # unreachable cluster cannot be repaired remotely. The cost is that resources
  # dropped by a version change linger — review each transition for orphans,
  # webhooks first.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
