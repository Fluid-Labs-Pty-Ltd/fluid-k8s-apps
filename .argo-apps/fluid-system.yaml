apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fluid: "true"
    category: system
  annotations:
    fluidhq.io/display: "Fluid System"
  name: fluid-system
  namespace: argocd
spec:
  destination:
    namespace: fluid-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: fluid-system
    repoURL: "https://github.com/Fluid-Labs-Pty-Ltd/fluid-k8s-apps"
    targetRevision: BRANCHREPLACEMENT
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # The sluice-bootstrap Secret ships a locked random default but is rotated in place by an admin
  # via maestro. Ignore its data so selfHeal does not revert
  # the live passphrase back to the git default.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: sluice-bootstrap
      namespace: fluid-system
      jsonPointers:
        - /data
