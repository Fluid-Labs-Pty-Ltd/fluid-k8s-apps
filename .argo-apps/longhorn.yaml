apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fluid: "true"
    category: system
  annotations:
    fluidhq.io/display: "Cluster Storage"
  name: longhorn
  namespace: argocd
spec:
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: longhorn
    repoURL: "https://github.com/Fluid-Labs-Pty-Ltd/fluid-k8s-apps"
    targetRevision: BRANCHREPLACEMENT
  # prune is off because what it would delete is persistent volumes. The cost is that
  # resources dropped by a version change linger — review each transition for
  # orphans, webhooks first.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
