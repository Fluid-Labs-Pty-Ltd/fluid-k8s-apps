apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fluid: "true"
    category: system
  annotations:
    fluidhq.io/display: "Fluid Tunnel"
  name: fluid-tunnel
  namespace: argocd
spec:
  destination:
    namespace: fluid-tunnel
    server: https://kubernetes.default.svc
  project: default
  source:
    path: fluid-tunnel
    repoURL: "https://github.com/Fluid-Labs-Pty-Ltd/fluid-k8s-apps"
    targetRevision: BRANCHREPLACEMENT
  # prune is off because this is the channel remediation itself travels over — maestro
  # reads, cordon/drain, ArgoCD patching. Prune it and whatever broke can no longer be
  # reached to be fixed. The cost is that resources dropped by a version change linger
  # — review each transition for orphans, webhooks first.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
