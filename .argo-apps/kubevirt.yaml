apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fluid: "true"
    category: system
  annotations:
    fluidhq.io/display: "Virtualization"
  name: kubevirt
  namespace: argocd
spec:
  destination:
    namespace: kubevirt
    server: https://kubernetes.default.svc
  project: default
  source:
    path: kubevirt
    repoURL: "https://github.com/Fluid-Labs-Pty-Ltd/fluid-k8s-apps"
    targetRevision: BRANCHREPLACEMENT
  # prune is off because a source path rendering fewer resources than the live set
  # would take the operator and the CRs with it, and therefore every VM. CDI ships
  # from this same directory, so an in-flight DataVolume import would go too. The
  # cost is that resources dropped by a version change linger — review each
  # transition for orphans, webhooks first.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
