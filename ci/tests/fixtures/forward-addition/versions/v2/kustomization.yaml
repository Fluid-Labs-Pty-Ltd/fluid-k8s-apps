# Adds beta relative to its sibling v1, and removes nothing. v1 is the directory that
# fails: a cluster on v2 moving back to v1 has beta pruned.
#
# This fixture also has no pre-versions kustomization.yaml, so it is the only one
# covering the state the repo is left in once the legacy path is deleted and the
# siblings carry the comparison alone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: alpha
    literals: [k=v]
  - name: beta
    literals: [k=v]
