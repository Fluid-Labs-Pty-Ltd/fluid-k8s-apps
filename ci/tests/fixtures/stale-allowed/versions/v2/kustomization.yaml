# Renders exactly what its sibling does, so nothing is a subset. The only thing wrong
# with this fixture is the .allowed-removals beside it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: alpha
    literals: [k=v]
