# Identity fluid-agent uses for its pre-reboot cordon check (FS-010 D43, CU-86d40yyf3).
# One shared SA for every node rather than one per node: RBAC can only scope a Node
# grant to "my own node" via resourceNames, which would need an SA/Role/binding
# created at join and cleaned up at removal. Cluster-wide read of Node objects
# exposes no secrets, so the shared SA is the cheaper and safer lifecycle.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluid-agent-node-reader
# The DaemonSet mounts its own audience-bound, short-lived projected token; the
# legacy auto-mounted token would only be a second, unused credential.
automountServiceAccountToken: false
