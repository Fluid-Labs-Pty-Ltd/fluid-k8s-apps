# get on nodes and nothing else (NF-19). No list/watch: the agent reads exactly
# its own Node by name. No write verbs: the credential lands on the host, so it
# must not be able to cordon, label or patch anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluid-agent-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
