# Credential mirror for fluid-agent (FS-010 D43, CU-86d40yyf3).
#
# fluid-agent is a host systemd process, not a pod, so it cannot be handed a
# projected ServiceAccount token directly. Each pod here gets one (short-lived,
# audience-bound, rotated in place by the kubelet) and renders a complete
# kubeconfig — endpoint, CA bundle and token — onto the host for the agent's
# pre-reboot cordon check. Same bridge as fluid-os-v2's kubelet-token distributor.
#
# Host contract: /run/fluid/kube/kubeconfig, root-owned, mode 0600. /run is tmpfs,
# so no token outlives a reboot on the persistent overlay; the pod re-renders it
# once it is scheduled again. Absent file => the agent reports
# checkFailed(noCredential), never notCordoned.
#
# Must keep running on the node it exists for: a cordoned, drained node about to
# reboot. drain leaves DaemonSet pods alone and the DaemonSet controller tolerates
# node.kubernetes.io/unschedulable automatically; `operator: Exists` below also
# covers control-plane taints.
#
# Endpoint: taken from the host's own kubelet kubeconfig rather than hard-coded.
# k3s servers serve the API on 127.0.0.1:6443, but agents reach it through the
# k3s client-side load balancer on 127.0.0.1:6444, so no single localhost port is
# right on both roles. The kubelet's kubeconfig holds the right one for its role
# (verified on fluid-dev: server node 6443, agent node 6444).
# The kubernetes ClusterIP is deliberately avoided: reaching it from the host
# network namespace depends on Cilium socketLB.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluid-agent-credential
  labels:
    app.kubernetes.io/name: fluid-agent-credential
    app.kubernetes.io/part-of: fluid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluid-agent-credential
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluid-agent-credential
        app.kubernetes.io/part-of: fluid
    spec:
      serviceAccountName: fluid-agent-node-reader
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: render
          # Chainguard busybox, tracking `latest` (the only tag its free tier
          # publishes) and pulled on every start, until this is mirrored to our GAR.
          image: cgr.dev/chainguard/busybox:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          # Re-render whenever the token, CA or endpoint changes, or the host file
          # goes missing. umask 077 creates the temp file 0600 from the start, and
          # the rename is atomic, so the agent never reads a partial file and needs
          # no restart when the token rotates. The kubelet refreshes the projected
          # token at ~80% of its TTL; a 30s poll stays well inside that window.
          args:
            - |
              set -eu
              umask 077
              src=/var/run/secrets/fluid-agent
              kubelet_kubeconfig=/host-k3s/kubelet.kubeconfig
              out=/host-kube/kubeconfig
              last=""
              while true; do
                server=$(sed -n 's/^[[:space:]]*server:[[:space:]]*//p' "$kubelet_kubeconfig" 2>/dev/null | head -n 1)
                # No guessed default: a guessed port is wrong on one role or the
                # other and would yield a plausible but unusable file. With no
                # file, the agent reports checkFailed(noCredential) instead.
                if [ -z "$server" ]; then
                  echo "$(date -u +%FT%TZ) no server in $kubelet_kubeconfig; not rendering" >&2
                  sleep 30
                  continue
                fi
                token=$(cat "$src/token")
                ca=$(base64 -w0 < "$src/ca.crt")
                cur="$server $ca $token"
                if [ "$cur" != "$last" ] || [ ! -s "$out" ]; then
                  cat > "$out.tmp" <<KUBECONFIG
              apiVersion: v1
              kind: Config
              clusters:
                - name: local
                  cluster:
                    server: $server
                    certificate-authority-data: $ca
              users:
                - name: fluid-agent
                  user:
                    token: $token
              contexts:
                - name: fluid-agent
                  context:
                    cluster: local
                    user: fluid-agent
              current-context: fluid-agent
              KUBECONFIG
                  chmod 600 "$out.tmp"
                  mv "$out.tmp" "$out"
                  last=$cur
                  echo "$(date -u +%FT%TZ) rendered kubeconfig for $server"
                fi
                sleep 30
              done
          readinessProbe:
            exec:
              command: ["test", "-s", "/host-kube/kubeconfig"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            # Root so the host file is root-owned 0600 (the agent runs as root).
            # The Chainguard image defaults to nonroot, so this must be explicit.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: credential
              mountPath: /var/run/secrets/fluid-agent
              readOnly: true
            - name: kubelet-kubeconfig
              mountPath: /host-k3s/kubelet.kubeconfig
              readOnly: true
            - name: host-kube
              mountPath: /host-kube
      volumes:
        - name: credential
          projected:
            sources:
              # Default audience (the API server), which is what the agent calls.
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        # Only the endpoint is read from this file. Mounted as a single file so the
        # pod cannot see the kubelet's client key beside it; it references its
        # certs by path and holds no key material inline.
        - name: kubelet-kubeconfig
          hostPath:
            path: /var/lib/rancher/k3s/agent/kubelet.kubeconfig
            type: File
        # Dedicated directory: the pod must not be able to write anything else on
        # the host.
        - name: host-kube
          hostPath:
            path: /run/fluid/kube
            type: DirectoryOrCreate
